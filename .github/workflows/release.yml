name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --manifest-path drf_accelerator/Cargo.toml ${{ matrix.os == 'ubuntu-latest' && format('-i python{0}', matrix.python-version) || '' }}
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path drf_accelerator/Cargo.toml

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    environment:
      name: testpypi
      url: https://test.pypi.org/p/drf-accelerator
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify tag matches pyproject version
        shell: bash
        run: |
          python - <<'PY'
          import os, re, tomllib
          tag = os.environ.get("GITHUB_REF_NAME", "")
          if tag and tag.startswith("v"):
              want = tag[1:]
              with open("pyproject.toml", "rb") as f:
                  data = tomllib.load(f)
              have = data["project"]["version"]
              if have != want:
                  raise SystemExit(f"pyproject.toml version {have!r} does not match tag {want!r}")
              print(f"OK: version {have} matches tag {tag}")
          else:
              print(f"Triggered by non-tag (e.g. workflow_dispatch). Skipping version tag match check.")
          PY

      - name: Publish to TestPyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [publish-testpypi]
    environment:
      name: pypi
      url: https://pypi.org/p/drf-accelerator
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify tag matches pyproject version
        shell: bash
        run: |
          python - <<'PY'
          import os, re, tomllib
          tag = os.environ.get("GITHUB_REF_NAME", "")
          if tag and tag.startswith("v"):
              want = tag[1:]
              with open("pyproject.toml", "rb") as f:
                  data = tomllib.load(f)
              have = data["project"]["version"]
              if have != want:
                  raise SystemExit(f"pyproject.toml version {have!r} does not match tag {want!r}")
              print(f"OK: version {have} matches tag {tag}")
          else:
              print(f"Triggered by non-tag (e.g. workflow_dispatch). Skipping version tag match check.")
          PY

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
