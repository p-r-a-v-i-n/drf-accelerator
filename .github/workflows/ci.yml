name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: drf_accelerator

      - name: Build and Install Wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: drf_accelerator
          command: build
          args: --release --out dist ${{ matrix.os == 'ubuntu-latest' && format('-i python{0}', matrix.python-version) || '' }}
          manylinux: auto

      - name: Install built wheel
        shell: bash
        run: |
          pip install drf_accelerator/dist/*.whl

      - name: Install test dependencies
        run: |
          pip install pytest djangorestframework django pytest-benchmark pytest-codspeed

      - name: Run tests
        working-directory: drf_accelerator
        run: pytest --ignore=benchmarks/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
          
      - name: Install ruff
        run: pip install ruff
        
      - name: Run ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: drf_accelerator

      - name: Run cargo fmt
        working-directory: drf_accelerator
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        working-directory: drf_accelerator
        run: cargo clippy --all-targets --all-features -- -D warnings

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
          
      - name: Install dependencies
        run: pip install --group docs
        
      - name: Build docs
        run: mkdocs build --strict
